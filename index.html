    <script> document.addEventListener('DOMContentLoaded', () => {
    const electroLinks = document.querySelectorAll('.electro-link');

  electroLinks.forEach(link => {
    // Split text into letters and wrap each in a <span>
    const text = link.textContent;
    link.innerHTML = text.split('').map((char, index) => 
      `<span style="animation-delay: ${index * 0.1}s">${char}</span>`
    ).join('');
  });
});</script>
